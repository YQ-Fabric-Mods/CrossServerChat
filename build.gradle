plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation include("net.kyori:adventure-platform-fabric:${project.adventure_platform_version}")
	implementation include("org.yaml:snakeyaml:2.6")
	implementation include("redis.clients:jedis:${project.jedis_version}")
	include("org.apache.commons:commons-pool2:2.12.1")
	include("org.json:json:20250517")
	include("redis.clients.authentication:redis-authx-core:0.1.1-beta2")

	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testImplementation "com.github.fppt:jedis-mock:1.1.16"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"
}

processResources {
	def modProperties = [
		version: project.version,
		minecraft_version: project.minecraft_version,
		loader_version: project.loader_version,
		fabric_api_version: project.fabric_api_version,
		adventure_platform_version: project.adventure_platform_version
	]
	inputs.properties modProperties

	filesMatching("fabric.mod.json") {
		expand modProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

tasks.named("test") {
	useJUnitPlatform()
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
